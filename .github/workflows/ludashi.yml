name: Build WinNative for Helio G99 G100

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Pull Git LFS assets
        run: git lfs pull

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build Standard and Ludashi APKs
        env:
          GRADLE_OPTS: -Xmx4g -XX:+UseG1GC
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug :app:assembleLudashiDebug --build-cache --parallel -x lint

      - name: Upload Standard APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-Helio-Standard-APK
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload Ludashi APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-Helio-Ludashi-APK
          path: app/build/outputs/apk/ludashi/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
