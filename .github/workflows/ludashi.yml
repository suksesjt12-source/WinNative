
name: Build WinNative Ludashi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ludashi:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Pull LFS
        run: git lfs pull

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build Ludashi APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:+UseG1GC
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleLudashiDebug --build-cache --parallel -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WinNative-Ludashi-Debug-APK
          path: app/build/outputs/apk/ludashi/debug/ludashi.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          
